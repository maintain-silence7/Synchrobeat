name: synchrobeat_app
description: "SynchroBeat - Multi-Platform Synchronized Group Audio Streaming"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Architecture, State Management & DI
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Routing & Navigation
  go_router: ^14.1.4

  # Backend & Network
  supabase_flutter: ^2.5.6
  dio: ^5.4.3+1
  uuid: ^4.4.0

  # Audio Subsystem & OS Background Services
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  just_audio_web: ^0.4.11
  audio_session: ^0.1.19

  # Local Media, Storage & Metadata Ingestion
  file_picker: ^8.0.3
  audiotags: ^1.4.0
  flutter_secure_storage: ^9.2.2

  # UI, Animation & Performance
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  reorderables: ^0.6.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
